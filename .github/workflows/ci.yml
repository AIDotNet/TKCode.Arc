name: CI

# verify:  build and test (Linux) on pushes to main and on pull requests; macOS is ci-macos.yml.
# templates: creates, builds and starts every dotnet new template case (pushes to main, pull requests).
# pack:    packs every TKCode.Arc package (the id lists below) (v* tag, or a manual run).
# nuget:   pushes them to nuget.org (v* tag, or a manual run with "publish" on).
#
# Publishing uses nuget.org Trusted Publishing: the job exchanges its GitHub OIDC token for a short-lived API key,
# so no key is stored. Policy on nuget.org: Owner AIDotNet, Repository TKCode.Arc, Workflow ci.yml,
# Environment nuget. The nuget.org username (profile name of the policy creator, not an email) is the secret
# NUGET_USER of the GitHub environment "nuget". nuget.org versions cannot be deleted, only unlisted: run a manual
# pack without "publish" and check the packages first.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Push the packages to nuget.org (off = pack only, keep them as a workflow artifact)
        type: boolean
        default: false
      tag:
        description: Existing tag to pack (empty = the branch the run was started on)
        type: string
        default: ""

# Only superseded branch and pull request runs are cancelled; a pack or push is never interrupted.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch') }}

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  # Package metadata shown on nuget.org; passed on the command line so it also applies to tags cut before it was set.
  REPOSITORY_URL: https://github.com/AIDotNet/TKCode.Arc

defaults:
  run:
    shell: bash

jobs:
  verify:
    # Linux only: macOS runs the same build and tests in ci-macos.yml, apart from this workflow, so a long wait for a
    # macOS runner (or a cancelled macOS job) never holds up or cancels pull requests, main or a release.
    name: Build and test (ubuntu-latest)
    if: github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # About 10 minutes of build and 30 or more of the headless control tests (which grow with every component).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          # global.json pins the .NET 11 SDK; the test projects run on .NET 10.
          global-json-file: global.json
          dotnet-version: 10.0.x

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'build/Versions.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      # The same three commands as the Verify section of AGENTS.md.
      - name: Build
        run: dotnet build TKCode.Arc.slnx

      - name: Test (Core)
        run: dotnet test tests/TKCode.Arc.Core.Tests --no-build

      - name: Test (controls, headless Avalonia)
        run: dotnet test tests/TKCode.Arc.Tests --no-build

  # Creates every dotnet new template case from freshly packed packages, builds it with warnings as errors and starts it
  # headless (tools/templates/verify_templates.py; design/engineering/project-templates.md section 6.3).
  templates:
    name: Templates
    if: github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          # The net8.0 case runs on the newer runtimes (DOTNET_ROLL_FORWARD=Major); net11.0 comes with the pinned SDK.
          global-json-file: global.json
          dotnet-version: 10.0.x

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'build/Versions.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      # The cross-platform cases build a WebAssembly host: net10.0-browser under the pinned .NET 11 SDK.
      - name: Install the WebAssembly build tools
        run: dotnet workload install wasm-tools-net10

      - name: Create, build and start every template case
        run: python3 tools/templates/verify_templates.py

  # Windows paths use '\', which once switched the library defaults off there without a build error (#31). Build only:
  # check that every project under src/ still counts as a library, then that it wrote its XML documentation.
  windows:
    name: Build (windows-latest)
    if: github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: 10.0.x

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'build/Versions.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Check the library defaults
        run: |
          failed=0
          for project in src/*/*.csproj; do
            name="$(basename "$project" .csproj)"
            values="$(dotnet msbuild "$project" -getProperty:ArcIsLibrary -getProperty:IsPackable -getProperty:GenerateDocumentationFile | tr -d '\r')"
            echo "$name: $(echo "$values" | tr -d ' \n')"
            if ! echo "$values" | grep -q '"ArcIsLibrary": "true"'; then
              echo "::error::$name does not count as a library (ArcIsLibrary is not true)"
              failed=1
            fi
            # The analyzer project switches packing and documentation off itself; it ships inside TKCode.Arc.Foundation.
            if [[ "$name" != *.Generators ]] && ! echo "$values" | grep -q '"IsPackable": "true"'; then
              echo "::error::$name is not packable"
              failed=1
            fi
          done
          exit $failed

      - name: Build
        run: dotnet build TKCode.Arc.slnx

      - name: Check the XML documentation
        run: |
          failed=0
          for project in src/*/*.csproj; do
            name="$(basename "$project" .csproj)"
            [[ "$name" == *.Generators ]] && continue
            if ! ls "src/$name"/bin/Debug/*/"$name.xml" > /dev/null 2>&1; then
              echo "::error::src/$name/bin/Debug/<tfm>/$name.xml is missing"
              failed=1
            fi
          done
          exit $failed

  # The video shim of TKCode.Arc.Video.Native (native/video, ABI in tkcode_video.h): built for every RID on every push and
  # pull request with the Zig in native/toolchain.json (Linux and Windows, cross-compiled on Linux) and Xcode clang (macOS),
  # then tested for real on each OS by the test executable of tests/TKCode.Arc.Video.Native.Tests (its Main services the
  # macOS main run loop that AVPlayer needs). design/components/video/completion-plan.md A5.
  video-native-build:
    name: Video shim (${{ matrix.host }})
    if: github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: linux
            os: ubuntu-24.04
          - host: macos
            os: macos-15
    env:
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache-global
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        if: matrix.host == 'linux'
        with:
          path: |
            ~/.cache/tkcode/zig
            ${{ github.workspace }}/.zig-cache-global
          key: zig-video-${{ hashFiles('native/toolchain.json') }}

      - name: Test the frame scaler
        run: cc -std=c11 -Wall -Wextra -Werror -O2 native/video/test/scale_test.c -o scale_test && ./scale_test

      - name: Build (Linux and Windows)
        if: matrix.host == 'linux'
        run: |
          tools/video/build-linux.sh linux-x64 linux-arm64
          tools/video/build-win.sh win-x64
          tools/video/build-win.sh win-arm64

      - name: Build (macOS)
        if: matrix.host == 'macos'
        run: |
          tools/video/build-mac.sh osx-arm64
          tools/video/build-mac.sh osx-x64

      - name: Check the glibc floor (2.28)
        if: matrix.host == 'linux'
        run: |
          for f in artifacts/native/linux-*/libtkcode_video.so; do
            max=$(objdump -T "$f" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
            echo "$f requires $max"
            [ "$(printf '%s\nGLIBC_2.28\n' "$max" | sort -V | tail -1)" = "GLIBC_2.28" ]
          done

      - uses: actions/upload-artifact@v7
        with:
          name: video-native-${{ matrix.host }}
          path: artifacts/native/*/*tkcode_video.*
          if-no-files-found: error
          retention-days: 7

  video-native-test:
    name: Video shim tests (${{ matrix.os }})
    needs: video-native-build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: 10.0.x

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'build/Versions.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - uses: actions/download-artifact@v8
        with:
          pattern: video-native-*
          path: artifacts/native
          merge-multiple: true

      # The packages the Linux backend needs for MP4 (H.264 / AAC): video.md section 15.
      - name: Install GStreamer
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends
          gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav

      # Windows Server ships Media Foundation as an optional feature; without it the tests skip (ArcVideoNative.Use() is false).
      - name: Install Media Foundation
        if: runner.os == 'Windows'
        shell: pwsh
        continue-on-error: true
        run: Install-WindowsFeature Server-Media-Foundation

      # Media Foundation needs these to play: what the runner has explains a stalled test.
      - name: List the sound and display devices
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-CimInstance Win32_SoundDevice | Format-List Name, Status
          Get-CimInstance Win32_VideoController | Format-List Name, Status

      - name: Stage the shim
        run: tools/video/sync-native.sh

      # The test project is an executable: on macOS its Main must own the main thread (AVPlayer), so it runs directly.
      - name: Test
        env:
          TKV_TRACE: ${{ runner.os == 'Windows' && '1' || '' }}
        run: dotnet run --project tests/TKCode.Arc.Video.Native.Tests -c Release

  # TKCode.Arc.Pdf.Native against the real PDFium on each OS (design/components/pdf/pdf.md section 14). The tests need the
  # library for the host's RID only.
  pdf-native-test:
    name: PDFium tests (${{ matrix.os }})
    if: github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
          - os: macos-15
            rid: osx-arm64
          - os: windows-latest
            rid: win-x64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: 10.0.x

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'build/Versions.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      # PDFium and Skia's Linux build load these.
      - name: Install the font libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libfontconfig1 libfreetype6

      - name: Download PDFium
        run: tools/pdf/sync-native.sh ${{ matrix.rid }}

      - name: Test
        run: dotnet test tests/TKCode.Arc.Pdf.Native.Tests -c Release

  # libghostty-vt for every RID, built from the commit pinned in native/ghostty/ghostty-upstream.json (+ overlays) with
  # the Zig in native/toolchain.json. Linux cross-compiles the Linux and Windows targets; the macOS targets need the
  # Apple SDK. TKCode.Arc.Terminal ships the results under runtimes/<rid>/native. The same job builds the miniaudio shim of
  # TKCode.Arc.Audio.Native (native/miniaudio, pinned in miniaudio-upstream.json) with the same Zig and RID split.
  native:
    name: Native (${{ matrix.host }})
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: linux
            os: ubuntu-24.04
            rids: linux-x64 linux-arm64 win-x64 win-arm64
          - host: macos
            os: macos-15
            rids: osx-arm64 osx-x64
    env:
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache-global
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Install llvm-strip
        if: matrix.host == 'linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q llvm

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/tkcode/zig
            ${{ github.workspace }}/.zig-cache-global
          key: zig-${{ matrix.host }}-${{ hashFiles('native/toolchain.json', 'native/ghostty/ghostty-upstream.json', 'native/miniaudio/miniaudio-upstream.json') }}

      - name: Build libghostty-vt
        run: for rid in ${{ matrix.rids }}; do tools/terminal/build-ghostty.sh "$rid"; done

      - name: Build the miniaudio shim
        run: for rid in ${{ matrix.rids }}; do tools/audio/build-miniaudio.sh "$rid"; done

      - name: Build the video shim
        run: |
          for rid in ${{ matrix.rids }}; do
            case "$rid" in
              linux-*) tools/video/build-linux.sh "$rid";;
              win-*) tools/video/build-win.sh "$rid";;
              osx-*) tools/video/build-mac.sh "$rid";;
            esac
          done

      # The Linux libraries must load on glibc 2.28 and newer.
      - name: Check the glibc floor (2.28)
        if: matrix.host == 'linux'
        run: |
          for f in artifacts/native/linux-*/lib*.so; do
            max=$(objdump -T "$f" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
            echo "$f requires $max"
            [ "$(printf '%s\nGLIBC_2.28\n' "$max" | sort -V | tail -1)" = "GLIBC_2.28" ]
          done

      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.host }}
          path: |
            artifacts/native/*/*ghostty-vt.*
            artifacts/native/*/ghostty-commit.txt
            artifacts/native/*/*tkcode_audio.*
            artifacts/native/*/miniaudio-version.txt
            artifacts/native/*/*tkcode_video.*
          if-no-files-found: error
          retention-days: 7

  pack:
    name: Pack
    needs: native
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Empty on tag pushes, which pack the tag that triggered the run.
          ref: ${{ inputs.tag }}

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: 10.0.x

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'build/Versions.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Read version and check it against the tag
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          version="$(sed -n 's:.*<ArcVersion>\(.*\)</ArcVersion>.*:\1:p' build/Versions.props)"
          if [[ -z "$version" ]]; then
            echo "::error::ArcVersion not found in build/Versions.props"
            exit 1
          fi
          tag=""
          if [[ "$EVENT_NAME" == push ]]; then
            tag="$REF_NAME"
          elif [[ -n "$TAG_INPUT" ]]; then
            tag="$TAG_INPUT"
          fi
          if [[ -n "$tag" && "$tag" != "v$version" ]]; then
            echo "::error::Tag $tag does not match ArcVersion $version (expected v$version)."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: artifacts/native
          merge-multiple: true

      # artifacts/native/<rid>/ -> runtimes/<rid>/native/ of TKCode.Arc.Terminal, TKCode.Arc.Audio.Native and TKCode.Arc.Video.Native
      - name: Stage the native libraries
        run: |
          tools/terminal/sync-native.sh
          tools/audio/sync-native.sh
          tools/video/sync-native.sh
          tools/pdf/sync-native.sh
          tools/pdf/sync-pdfjs.sh

      # Build the whole solution once, then pack without rebuilding.
      - name: Build
        run: >
          dotnet build TKCode.Arc.slnx -c Release
          -p:ContinuousIntegrationBuild=true
          -p:RepositoryUrl="$REPOSITORY_URL" -p:RepositoryType=git -p:PublishRepositoryUrl=true

      - name: Pack
        run: >
          dotnet pack TKCode.Arc.slnx -c Release --no-build -o artifacts/nupkg
          -p:ContinuousIntegrationBuild=true
          -p:RepositoryUrl="$REPOSITORY_URL" -p:RepositoryType=git -p:PublishRepositoryUrl=true
          -p:PackageProjectUrl="$REPOSITORY_URL"

      - name: Check the packages
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for id in TKCode.Arc TKCode.Arc.Foundation TKCode.Arc.Core TKCode.Arc.Fonts TKCode.Arc.Icons.Lucide TKCode.Arc.Blocks TKCode.Arc.AdvancedCharts TKCode.Arc.Special TKCode.Arc.Terminal TKCode.Arc.Workflow TKCode.Arc.Dock TKCode.Arc.Themes.Pixel TKCode.Arc.Themes.Corners TKCode.Arc.Mobile TKCode.Arc.Audio TKCode.Arc.Audio.Native TKCode.Arc.Audio.Browser TKCode.Arc.Pdf TKCode.Arc.Pdf.Native TKCode.Arc.Pdf.Browser TKCode.Arc.Video TKCode.Arc.Video.Native TKCode.Arc.Video.Browser; do
            for ext in nupkg snupkg; do
              file="artifacts/nupkg/$id.$VERSION.$ext"
              if [[ ! -f "$file" ]]; then
                echo "::error::Missing $file"
                exit 1
              fi
            done
          done
          # The dotnet new template package has no symbols package; its project file must name the packed version.
          templates="artifacts/nupkg/TKCode.Arc.Templates.$VERSION.nupkg"
          if [[ ! -f "$templates" ]]; then
            echo "::error::Missing $templates"
            exit 1
          fi
          unzip -p "$templates" content/ArcStarterApp/ArcStarterApp.csproj | grep -q "Include=\"TKCode.Arc\" Version=\"$VERSION\"" \
            || { echo "::error::$templates does not reference TKCode.Arc $VERSION"; exit 1; }
          # TKCode.Arc.Terminal must carry libghostty-vt for every RID.
          terminal="artifacts/nupkg/TKCode.Arc.Terminal.$VERSION.nupkg"
          for entry in runtimes/linux-x64/native/libghostty-vt.so runtimes/linux-arm64/native/libghostty-vt.so \
                       runtimes/win-x64/native/ghostty-vt.dll runtimes/win-arm64/native/ghostty-vt.dll \
                       runtimes/osx-x64/native/libghostty-vt.dylib runtimes/osx-arm64/native/libghostty-vt.dylib; do
            unzip -l "$terminal" | grep -q " $entry\$" || { echo "::error::$terminal lacks $entry"; exit 1; }
          done
          # TKCode.Arc.Audio.Native must carry the miniaudio shim for every RID.
          audio="artifacts/nupkg/TKCode.Arc.Audio.Native.$VERSION.nupkg"
          for entry in runtimes/linux-x64/native/libtkcode_audio.so runtimes/linux-arm64/native/libtkcode_audio.so \
                       runtimes/win-x64/native/tkcode_audio.dll runtimes/win-arm64/native/tkcode_audio.dll \
                       runtimes/osx-x64/native/libtkcode_audio.dylib runtimes/osx-arm64/native/libtkcode_audio.dylib; do
            unzip -l "$audio" | grep -q " $entry\$" || { echo "::error::$audio lacks $entry"; exit 1; }
          done
          # TKCode.Arc.Video.Native must carry the video shim for every RID.
          video="artifacts/nupkg/TKCode.Arc.Video.Native.$VERSION.nupkg"
          for entry in runtimes/linux-x64/native/libtkcode_video.so runtimes/linux-arm64/native/libtkcode_video.so \
                       runtimes/win-x64/native/tkcode_video.dll runtimes/win-arm64/native/tkcode_video.dll \
                       runtimes/osx-x64/native/libtkcode_video.dylib runtimes/osx-arm64/native/libtkcode_video.dylib; do
            unzip -l "$video" | grep -q " $entry\$" || { echo "::error::$video lacks $entry"; exit 1; }
          done
          # TKCode.Arc.Pdf.Native must carry PDFium for every RID, its licenses and its notices.
          pdf="artifacts/nupkg/TKCode.Arc.Pdf.Native.$VERSION.nupkg"
          for entry in runtimes/linux-x64/native/libpdfium.so runtimes/linux-arm64/native/libpdfium.so \
                       runtimes/win-x64/native/pdfium.dll runtimes/win-arm64/native/pdfium.dll \
                       runtimes/osx-x64/native/libpdfium.dylib runtimes/osx-arm64/native/libpdfium.dylib \
                       licenses/pdfium.txt licenses/freetype.txt licenses/pdfium-binaries.txt PDFIUM-NOTICES.md; do
            unzip -l "$pdf" | grep -q " $entry\$" || { echo "::error::$pdf lacks $entry"; exit 1; }
          done
          # TKCode.Arc.Pdf.Browser must carry pdf.js and its notices.
          pdfjs="artifacts/nupkg/TKCode.Arc.Pdf.Browser.$VERSION.nupkg"
          for entry in staticwebassets/pdfjs/pdf.min.mjs staticwebassets/pdfjs/pdf.worker.min.mjs \
                       staticwebassets/pdfjs/wasm/openjpeg.wasm staticwebassets/pdfjs/cmaps/UniGB-UCS2-H.bcmap PDFJS-NOTICES.md; do
            unzip -l "$pdfjs" | grep -q " $entry\$" || { echo "::error::$pdfjs lacks $entry"; exit 1; }
          done
          ls -l artifacts/nupkg
          for pkg in artifacts/nupkg/*.nupkg; do
            echo "::group::$pkg"
            unzip -p "$pkg" '*.nuspec'
            unzip -l "$pkg"
            echo "::endgroup::"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: artifacts/nupkg/*
          if-no-files-found: error
          retention-days: 30

  nuget:
    name: Push to nuget.org
    # v* tag, or a manual run with "publish" on.
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: nuget
    permissions:
      contents: read
      id-token: write # the OIDC token that NuGet/login exchanges for a short-lived API key
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: nupkg
          path: nupkg

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Check the nuget.org user
        env:
          NUGET_USER: ${{ secrets.NUGET_USER }}
        run: |
          if [[ -z "$NUGET_USER" ]]; then
            echo "::error::Add the secret NUGET_USER to the GitHub environment 'nuget': the nuget.org profile name (not the email) of the Trusted Publisher policy creator."
            exit 1
          fi

      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      # The matching .snupkg next to each .nupkg is pushed too. Foundation goes first (Core depends on it), then Core, the packages that depend on it after (TKCode.Arc before Blocks, AdvancedCharts and Special; TKCode.Arc.Audio before Blocks and its backends). The templates go last: they reference the others by version.
      - name: Push
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          for id in TKCode.Arc.Foundation TKCode.Arc.Core TKCode.Arc.Fonts TKCode.Arc.Icons.Lucide TKCode.Arc.Audio TKCode.Arc.Audio.Native TKCode.Arc.Audio.Browser TKCode.Arc TKCode.Arc.Pdf TKCode.Arc.Pdf.Native TKCode.Arc.Pdf.Browser TKCode.Arc.Video TKCode.Arc.Video.Native TKCode.Arc.Video.Browser TKCode.Arc.Blocks TKCode.Arc.AdvancedCharts TKCode.Arc.Special TKCode.Arc.Terminal TKCode.Arc.Workflow TKCode.Arc.Dock TKCode.Arc.Themes.Pixel TKCode.Arc.Themes.Corners TKCode.Arc.Mobile TKCode.Arc.Templates; do
            dotnet nuget push "nupkg/$id.${{ needs.pack.outputs.version }}.nupkg" \
              --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done
