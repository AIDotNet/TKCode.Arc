# Gallery WebAssembly host. Files are pre-compressed at build time (*.br, *.gz), served by brotli_static / gzip_static.
user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/log/nginx/access.log;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    brotli_static on;
    brotli on;
    brotli_comp_level 6;
    brotli_types application/wasm application/javascript text/javascript text/css application/json image/svg+xml text/plain application/xml text/markdown;

    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_types application/wasm application/javascript text/javascript text/css application/json image/svg+xml text/plain application/xml text/markdown;

    server {
        listen 80;
        root /usr/share/nginx/html;
        index index.html;

        # Fingerprinted framework files (name carries a content hash) never change: cache them for a year.
        location ~* "^/_framework/.+\.[0-9a-z]{8,}\.(js|wasm|dat|json|dll|pdb|css|map)$" {
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # Other framework files (avalonia.js, storage.js, sw.js) keep their name: revalidate on every request.
        location /_framework/ {
            add_header Cache-Control "no-cache";
            try_files $uri =404;
        }

        # The docs screenshots (shots/) and the Chinese font (fonts/, regenerated when the docs gain characters) keep their names
        # when a deploy changes them: revalidate on every request (a 304 when unchanged), so a returning visitor never gets
        # yesterday's picture, or a font without today's characters.
        location ~* ^/(shots|fonts)/ {
            add_header Cache-Control "no-cache";
            try_files $uri =404;
        }

        # Other images under the site root (the icons): one day.
        location ~* \.(png|webp|otf|ico|jpg|jpeg|gif|woff2|svg)$ {
            add_header Cache-Control "public, max-age=86400";
            try_files $uri =404;
        }

        # The files for AI assistants (gallery/TKCode.Arc.Gallery.Llms): llms.txt, llms-full.txt, every page as Markdown at its
        # address plus .md, and the skill; and the pages' text the gallery fetches when it shows a page (content/, HttpTextSource).
        # UTF-8 (the translations), readable from any origin, revalidated, and a missing page is a 404 instead of the app's index.html.
        location ~* \.(md|txt)$ {
            types {
                text/markdown md;
                text/plain txt;
            }
            charset utf-8;
            charset_types text/markdown text/plain;
            add_header Cache-Control "no-cache";
            add_header Access-Control-Allow-Origin "*";
            try_files $uri =404;
        }

        # index.html references the fingerprinted files, so it is always revalidated.
        location / {
            add_header Cache-Control "no-cache";
            try_files $uri $uri/ /index.html;
        }
    }
}
