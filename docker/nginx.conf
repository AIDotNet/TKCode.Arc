# Gallery WebAssembly host. Files are pre-compressed at build time (*.br, *.gz), served by brotli_static / gzip_static.
user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/log/nginx/access.log;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    brotli_static on;
    brotli on;
    brotli_comp_level 6;
    brotli_types application/wasm application/javascript text/javascript text/css application/json image/svg+xml text/plain application/xml;

    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_types application/wasm application/javascript text/javascript text/css application/json image/svg+xml text/plain application/xml;

    server {
        listen 80;
        root /usr/share/nginx/html;
        index index.html;

        # Fingerprinted framework files (name carries a content hash) never change: cache them for a year.
        location ~* "^/_framework/.+\.[0-9a-z]{8,}\.(js|wasm|dat|json|dll|pdb|css|map)$" {
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # Other framework files (avalonia.js, storage.js, sw.js) keep their name: revalidate on every request.
        location /_framework/ {
            add_header Cache-Control "no-cache";
            try_files $uri =404;
        }

        # Images and fonts under the site root: one day.
        location ~* \.(png|webp|otf|ico|jpg|jpeg|gif|woff2|svg)$ {
            add_header Cache-Control "public, max-age=86400";
            try_files $uri =404;
        }

        # index.html references the fingerprinted files, so it is always revalidated.
        location / {
            add_header Cache-Control "no-cache";
            try_files $uri $uri/ /index.html;
        }
    }
}
