<!DOCTYPE html>
<html>

<head>
    <title>TKCode.Arc Gallery</title>
    <meta charset="UTF-8">
    <!-- Pages have addresses such as /components/button (BrowserRouter), so every relative URL below starts at the site's root. -->
    <base href="/">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- The app draws to a canvas, so this page carries no text. AI assistants read the pages as Markdown instead, starting from
         llms.txt (written by gallery/TKCode.Arc.Gallery.Llms when the site is built). -->
    <meta name="description" content="TKCode.Arc: Arc's components for Avalonia. AI assistants: every page is available as Markdown, listed in /llms.txt.">
    <link rel="alternate" type="text/plain" href="llms.txt" title="Docs for AI assistants (llms.txt)">
    <!-- Bump ?v= when the icons change: they are cached for a day (docker/nginx.conf) and browsers keep favicons longer still. -->
    <link rel="icon" type="image/png" href="favicon.png?v=2">
    <link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
    <link rel="preload" id="webassembly" />
    <script type="importmap"></script>
    <script type='module' src="main#[.{fingerprint}].js"></script>
</head>

<body style="margin: 0; overflow: hidden">
<div id="out">
    <div class="avalonia-splash" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100">
        <img class="splash-mark" src="splash-mark.png?v=2" alt="" width="44" height="44">
        <div class="splash-name">TKCode.Arc</div>
        <div class="splash-track"><div class="splash-bar" id="splash-bar"></div></div>
        <div class="splash-status" id="splash-status">0%</div>
    </div>
</div>
<style>
    /* Avalonia adds splash-close once the first frame is drawn. Colors follow Arc's neutral palette, light and dark. */
    .avalonia-splash {
        --fg: #0a0a0a;
        --muted: #737373;
        --track: #e5e5e5;
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
        color: var(--fg);
        background: #ffffff;
        pointer-events: none;
        transition: opacity .25s ease;
    }

    .avalonia-splash.splash-close {
        display: none;
    }

    .splash-mark {
        animation: splash-breathe 2s ease-in-out infinite;
    }

    .splash-name {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: -.01em;
    }

    .splash-track {
        width: 160px;
        height: 3px;
        border-radius: 999px;
        background: var(--track);
        overflow: hidden;
    }

    .splash-bar {
        width: 100%;
        height: 100%;
        border-radius: inherit;
        background: var(--fg);
        transform: scaleX(0);
        transform-origin: left;
        transition: transform .3s cubic-bezier(.2, .8, .2, 1);
    }

    /* After the download the runtime starts and draws the first frame: no number to show, so the bar sweeps. */
    .avalonia-splash.splash-starting .splash-bar {
        width: 40%;
        transform: none;
        transition: none;
        animation: splash-sweep 1.1s ease-in-out infinite;
    }

    .splash-status {
        font-size: 12px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
    }

    @keyframes splash-sweep {
        from { margin-left: -40%; }
        to { margin-left: 100%; }
    }

    @keyframes splash-breathe {
        50% { opacity: .55; }
    }

    @media (prefers-reduced-motion: reduce) {
        .splash-mark, .avalonia-splash.splash-starting .splash-bar { animation: none; }
        .splash-bar { transition: none; }
    }

    @media (prefers-color-scheme: dark) {
        .avalonia-splash {
            --fg: #fafafa;
            --muted: #a3a3a3;
            --track: #2a2a2a;
            background: #141414;
        }
    }
</style>
</body>

</html>
