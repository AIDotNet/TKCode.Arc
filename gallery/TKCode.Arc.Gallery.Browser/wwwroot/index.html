<!DOCTYPE html>
<html>

<head>
    <title>TKCode.Arc Gallery</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preload" id="webassembly" />
    <script type="importmap"></script>
    <script type='module' src="main#[.{fingerprint}].js"></script>
</head>

<body style="margin: 0; overflow: hidden">
<div id="out">
    <div class="avalonia-splash">TKCode.Arc Gallery</div>
</div>
<style>
    /* Avalonia adds splash-close once the first frame is drawn. */
    .avalonia-splash {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, sans-serif;
        color: #5b6470;
        background: #ffffff;
        pointer-events: none;
    }

    .avalonia-splash.splash-close {
        display: none;
    }

    @media (prefers-color-scheme: dark) {
        .avalonia-splash {
            color: #9aa3ad;
            background: #141414;
        }
    }
</style>
</body>

</html>
